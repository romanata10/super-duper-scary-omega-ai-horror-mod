name: Build Forge mod
on:
  push:
    branches: [ arena/7975fdd6-super-duper-scary-omega-ai-hor ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Build the mod jar
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build-log.txt || {
            grep -A 8 -E 'error:|What went wrong:|FAILURE:|Could not ' build-log.txt | head -60 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Smoke test — boot dedicated server with the mod
        shell: bash
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          timeout --signal=TERM 260 gradle runServer --no-daemon > server-boot.txt 2>&1 || true
          echo "--- server log tail ---"
          tail -n 60 run/logs/latest.log 2>/dev/null || echo "NO LOG"
          if grep -qE 'Exception in thread|Caused by:|Failed to load|com\.omega\.horror' run/logs/latest.log 2>/dev/null; then
            grep -B2 -A15 -E 'Exception in thread|Caused by:|Failed to load|com\.omega\.horror' run/logs/latest.log | head -100 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          if grep -q 'Done (' run/logs/latest.log; then echo '::notice::server booted OK with the mod'; else echo '::error::server did not reach Done — see log tail above'; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: omega-horror-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish jar to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 build/libs/*.jar \
            --target "$GITHUB_SHA" \
            --title 'Super Duper Scary Omega AI Horror Mod v1.0.0' \
            --notes 'Очень страшный хоррор-мод для Minecraft 1.20.1 (Forge 47.2.0). 16 фичей: планета Iris, David, молоко-жидкость, злые кнопки, торнадо, Krita, браузер-ПК, злые рыбки, soundpad, самолёт, mart, NULL, носки фембойчика и взлом от насоса Василия. Jar нужно положить в папку mods.' \
            || gh release upload v1.0.0 build/libs/*.jar --clobber
