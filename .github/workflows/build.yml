name: build-mod-jar
on:
  push:
    branches: [ arena/7975fdd6-super-duper-scary-omega-ai-hor ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build the mod jar with ForgeGradle
        run: gradle build --no-daemon
      - name: Upload jar to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 --title "Super Duper Scary Omega AI Horror Mod v1.0.0" --notes "Очень страшный хоррор-мод. Скачай .jar и закинь в папку mods." || true
          gh release upload v1.0.0 build/libs/*.jar --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
