name: Build Forge mod
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build-log.txt || {
            grep -A 8 -E 'error:|What went wrong:|FAILURE:|Could not ' build-log.txt | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: omega-horror-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish prototype release
        if: github.ref == 'refs/heads/arena/246c8239-super-duper-scary-omega-ai-hor'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view prototype-0.2.0 >/dev/null 2>&1; then
            gh release create prototype-0.2.0 build/libs/omega-horror-0.2.0.jar \
              --target "$GITHUB_SHA" --prerelease --title 'Omega Horror 0.2.0 — прототип' \
              --notes 'Ранний прототип для Minecraft Java 1.20.1 и Forge 47.2.0. Не все запрошенные функции реализованы; в игре не проверен. Подробнее см. README в исходном коде.'
          fi
